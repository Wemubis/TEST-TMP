---
# Traitement d'une image, de l'export au CSV.
#
# Les trois premières tâches s'exécutent sur l'hôte source, la dernière sur la
# capsule. L'archive est détruite des deux côtés avant de passer à l'image
# suivante : une seule archive existe donc à la fois, sur l'hôte comme sur la
# capsule, quel que soit le nombre d'images.
#
# Le bloc rescue est indispensable : sans lui, un échec sur une image marque
# l'hôte en défaut, le retire du jeu, et les images suivantes ne sont jamais
# traitées. ignore_errors sur l'include ne suffit pas.

- name: "Traiter {{ img.ref }}"
  block:

    - name: "Exporter {{ img.ref }} sur {{ img.source }}"
      # docker save refuse --format ; podman l'exige pour garantir le format
      # attendu par Grype.
      ansible.builtin.command:
        cmd: >-
          {{ img.moteur }} save
          {{ '--format docker-archive' if img.moteur == 'podman' else '' }}
          -o {{ rep_travail_hote }}/{{ img.court }}.tar {{ img.id }}
      delegate_to: "{{ img.source }}"
      changed_when: true

    # fetch emprunte la connexion d'Ansible : rebond, clé et options de
    # ansible.cfg s'appliquent sans avoir à les redéclarer.
    #
    # Sans become, fetch passe par sftp et streame le fichier. Avec become, il
    # bascule sur slurp, qui encode en base64 et charge tout en mémoire : à
    # proscrire sur des archives de cette taille.
    - name: "Rapatrier {{ img.ref }} sur la capsule"
      ansible.builtin.fetch:
        src: "{{ rep_travail_hote }}/{{ img.court }}.tar"
        dest: "{{ rep_travail }}/{{ img.court }}.tar"
        flat: true
        # Compare les empreintes de part et d'autre : une archive tronquée
        # par une coupure est détectée ici.
        validate_checksum: true
      delegate_to: "{{ img.source }}"

    - name: "Analyser {{ img.ref }} et écrire un CSV par hôte porteur"
      vulnscan.scan.analyser_image:
        archive: "{{ rep_travail }}/{{ img.court }}.tar"
        reference: "{{ img.ref }}"
        porteurs: "{{ img.porteurs }}"
        repertoire_resultats: "{{ rep_resultats }}"
        gabarit_csv: "{{ gabarit_csv }}"
        grype: "{{ grype }}"
      delegate_to: localhost

  rescue:

    # Une image non analysée doit apparaître dans le bilan, jamais disparaître
    # en silence.
    - name: "Consigner l'échec sur {{ img.ref }}"
      ansible.builtin.set_fact:
        echecs: >-
          {{ echecs | default([]) + [{
               'image': img.ref,
               'source': img.source,
               'motif': ansible_failed_result.msg
                        | default('échec non qualifié') }] }}
      delegate_to: localhost
      run_once: true

    - name: "Retirer l'archive restée sur la capsule après {{ img.ref }}"
      ansible.builtin.file:
        path: "{{ rep_travail }}/{{ img.court }}.tar"
        state: absent
      delegate_to: localhost

  always:

    # L'archive quitte l'hôte quoi qu'il arrive, succès ou échec.
    - name: "Retirer l'archive de {{ img.source }}"
      ansible.builtin.file:
        path: "{{ rep_travail_hote }}/{{ img.court }}.tar"
        state: absent
      delegate_to: "{{ img.source }}"
